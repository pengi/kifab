[project]
name = "kifab"
version = "0.1.0"
description = "Manage KiCad projects in a git-friendly way, with the fabrication service as part of the project"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Max Sikström" }]
dependencies = [
    "easyeda2kicad>=1.0.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
kifab = "kifab.cli.main:main"

[project.gui-scripts]
kifab-gui = "kifab.gui.app:main"

[project.entry-points."kifab.fabs"]
jlcpcb = "kifab.fabs.jlcpcb:JlcpcbFab"

[project.optional-dependencies]
gui = [
    "pyside6-essentials>=6.6",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pyside6-essentials>=6.6",  # so mypy and the GUI tests see the GUI
    "tomli>=2.0",  # mypy checks the Python 3.10 branch, which imports tomli
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kifab"]

[tool.black]
line-length = 88

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
