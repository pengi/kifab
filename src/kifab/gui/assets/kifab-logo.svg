<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 160" width="476" height="160">
  <title>kifab</title>
  <style>
    .word { stroke: #1d5c3f; }
    @media (prefers-color-scheme: dark) { .word { stroke: #e9efe9; } }
  </style>

  <!-- Icon -->
  <g transform="scale(0.625)">
    <rect x="8" y="8" width="240" height="240" rx="52" fill="#1d5c3f"/>
    <g fill="none" stroke="#e9efe9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M44 78 V44 H78"/>
      <path d="M178 212 H212 V178"/>
    </g>
    <circle cx="56" cy="200" r="13" fill="none" stroke="#e8b04a" stroke-width="4" opacity="0.6"/>
    <circle cx="56" cy="200" r="6" fill="#e8b04a"/>
    <path d="M64 136 L106 178 L190 94" fill="none" stroke="#e8b04a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64" cy="136" r="21" fill="#e8b04a"/>
    <circle cx="64" cy="136" r="8" fill="#123d29"/>
    <circle cx="190" cy="94" r="21" fill="#e8b04a"/>
    <circle cx="190" cy="94" r="8" fill="#123d29"/>
  </g>

  <!-- Wordmark: letters drawn as 45°-routed traces -->
  <g transform="translate(204 8)">
    <g class="word" fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <!-- k -->
      <path d="M0 28 V118"/>
      <path d="M30 58 L2 86 L34 118"/>
      <!-- i -->
      <path d="M54 62 V118"/>
      <!-- f -->
      <path d="M90 118 V50 L104 36 H118"/>
      <path d="M78 66 H110"/>
      <!-- a -->
      <path d="M184 58 V118"/>
      <path d="M184 72 L170 58 H152 L138 72 V104 L152 118 H170 L184 104"/>
      <!-- b -->
      <path d="M208 28 V118"/>
      <path d="M208 72 L222 58 H240 L254 72 V104 L240 118 H222 L208 104"/>
    </g>
    <!-- dot of the i is a via -->
    <circle cx="54" cy="34" r="11" fill="#e8b04a"/>
    <circle cx="54" cy="34" r="4.5" fill="#123d29"/>
  </g>
</svg>
