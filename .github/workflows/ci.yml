name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Libraries Qt needs for the headless GUI tests
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - run: uv sync --locked
      - run: uv run black --check src tests
      - run: uv run mypy
      - run: uv run pytest

  real-kicad:
    # tests/test_real_kicad.py and the kicad-cli format tests against kicad-cli 10
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python /usr/bin/python3
      - run: uv run pytest tests/test_real_kicad.py tests/test_kicad_cli_formats.py -ra
