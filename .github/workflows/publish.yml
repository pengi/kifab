name: publish

# Publishes kifab to PyPI when a tag v<version> is pushed to this repository.
# One-time setup on pypi.org: add a "trusted publisher" for this repository,
# workflow "publish.yml", environment "pypi" (no token needed).
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tag matches the package version
        run: |
          version=$(uv run --no-sync python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv sync --locked
      - run: uv run black --check src tests && uv run mypy && uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
